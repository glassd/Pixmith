name: Release

# Runs only when a version tag is pushed, e.g.:
#   git tag v0.6.0 && git push origin v0.6.0
# It builds the Claude Desktop bundle and attaches it to a GitHub Release.
# It then publishes to npm through trusted publishing (OIDC): npm trusts this
# workflow file, so no npm token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json, manifest.json and the plugin manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          man="$(node -p "require('./manifest.json').version")"
          plug="$(node -p "require('./.claude-plugin/plugin.json').version")"
          echo "tag=$tag package.json=$pkg manifest.json=$man plugin.json=$plug"
          test "$tag" = "$pkg" && test "$tag" = "$man" && test "$tag" = "$plug"

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      # Stages production dependencies only, packs, then checks the bundle.
      - run: npm run bundle
      - run: mv dist/pixmith.mcpb "dist/pixmith-${GITHUB_REF_NAME#v}.mcpb"
      # Skills as uploadable zips (a folder holding SKILL.md) for Claude Desktop and claude.ai.
      - name: Skill zips
        run: |
          cd skills
          for s in */; do s="${s%/}"; zip -qr "../dist/pixmith-${s}-skill.zip" "$s"; done
          ls -l ../dist

      - name: GitHub Release with the bundle and skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/pixmith-*.mcpb dist/pixmith-*-skill.zip --title "Pixmith ${GITHUB_REF_NAME}" --generate-notes

      # Trusted publishing needs npm 11.5.1+, newer than the npm bundled with
      # Node 22, and the id-token permission above. Provenance is automatic.
      # Set up on npmjs.com under the package's Trusted Publisher settings:
      # GitHub Actions, glassd / Pixmith / release.yml, allowing `npm publish`.
      - name: Publish to npm
        run: |
          npm install -g npm@11
          npm --version
          npm publish --access public
