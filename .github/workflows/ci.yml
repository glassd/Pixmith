name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported Node version on Linux; one each on macOS and Windows,
      # whose runners are scarcer. Windows still exercises the .cmd shim path.
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  bundle:
    name: Claude Desktop bundle and npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Production dependencies only: the bundle ships node_modules as it is.
      - run: npm ci --omit=dev
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: npm run bundle
      - run: node scripts/check-bundle.js dist/pixmith.mcpb
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: pixmith-mcpb
          path: dist/pixmith.mcpb
          retention-days: 14
